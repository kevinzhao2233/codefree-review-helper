name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"

      - run: npm ci

      - run: npm test

      - run: npm run build

      # Trusted publishing (OIDC) needs npm >= 11.5.1; no token secret involved.
      - run: npm install -g npm@^11.5.1

      # Skip when this version is already on npm (e.g. the very first release
      # was published manually before the package could have a trusted
      # publisher configured — npm requires an existing package for that).
      - name: Publish (skip if version already on npm)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "codefree-review-helper@${VERSION}" version >/dev/null 2>&1; then
            echo "Version ${VERSION} is already published; skipping npm publish."
          else
            npm publish --provenance --access public
          fi
